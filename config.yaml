seed: 42

paths:
  raw_dir: data/raw
  own_dir: data/own_recordings
  processed_dir: data/processed
  models_dir: models
  results_dir: results

# Folder names under raw_dir / own_dir. Order defines the class ids.
# 30 words from INCLUDE, each with 20-21 videos.
words:
  - hello
  - good_morning
  - good_night
  - thank_you
  - how_are_you
  - i
  - you
  - we
  - he
  - she
  - they
  - father
  - mother
  - brother
  - sister
  - friend
  - good
  - bad
  - happy
  - sick
  - hot
  - cold
  - new
  - house
  - school
  - hospital
  - market
  - car
  - bus
  - dog

video_extensions: [.mov, .mp4, .avi]

holistic:
  model_complexity: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  refine_face_landmarks: false
  # INCLUDE videos are 1920x1080; downscaling first makes extraction faster.
  max_frame_width: 960

features:
  # nose, left/right shoulder, left/right elbow, left/right wrist
  pose_indices: [0, 11, 12, 13, 14, 15, 16]
  pose_mirror_pairs: [[11, 12], [13, 14], [15, 16]]

  # Sides follow MediaPipe naming: the signer's own left/right, so "left" appears on the
  # right of an unmirrored image. Verified against FACEMESH_* in mediapipe 0.10.21.
  face_regions:
    right_eyebrow: [70, 63, 105, 66, 107, 55, 65, 52, 53, 46]
    left_eyebrow: [300, 293, 334, 296, 336, 285, 295, 282, 283, 276]
    right_eye: [33, 160, 158, 133, 153, 144]
    left_eye: [263, 387, 385, 362, 380, 373]
    lips_outer: [61, 146, 91, 181, 84, 17, 314, 405, 321, 375, 291, 409, 270, 269, 267, 0, 37, 39, 40, 185]
    nose_tip: [1]

  # Each face point and its mirror image, checked by reflecting the MediaPipe canonical
  # face model across its midline. Points not listed (17, 0, 1) lie on the midline.
  face_mirror_pairs:
    - [70, 300]
    - [63, 293]
    - [105, 334]
    - [66, 296]
    - [107, 336]
    - [55, 285]
    - [65, 295]
    - [52, 282]
    - [53, 283]
    - [46, 276]
    - [33, 263]
    - [160, 387]
    - [158, 385]
    - [133, 362]
    - [153, 380]
    - [144, 373]
    - [61, 291]
    - [146, 375]
    - [91, 321]
    - [181, 405]
    - [84, 314]
    - [185, 409]
    - [40, 270]
    - [39, 269]
    - [37, 267]

  shoulder_min_visibility: 0.5
  eps: 1.0e-6

temporal:
  seq_len: 30
  min_hand_frames: 8

split:
  # INCLUDE has no signer IDs. One signer records many words in a row, so camera file numbers
  # that are close together (across all words) form a sitting. Whole sittings go to train, val
  # or test; otherwise the model can recognise the person instead of the sign.
  sitting_max_gap: 10
  # Greetings and pronouns were filmed on cameras with overlapping counters, which chains them
  # into blocks of 110+ clips. Blocks larger than this are re-split at gaps above fallback_gap.
  max_sitting_clips: 60
  fallback_gap: 5
  test_fraction: 0.2
  val_fraction: 0.2  # of what remains after the test set
  max_attempts: 2000

augment:
  scale_range: [0.9, 1.1]
  rotation_deg: 10
  noise_std: 0.02  # in normalized units (hand length / shoulder width)
  # Uniform speed changes vanish when clips are resampled to seq_len, so time warping
  # instead varies the speed within a clip and jitters where the sign starts and ends.
  time_warp_gamma: [0.8, 1.25]
  boundary_jitter: 0.1  # max fraction of the clip cropped at each end
  flip: false

# Chosen on validation accuracy in the LSTM ablation (results/ablation.md): the face adds 159
# features that overfit 382 training clips, and pose helps over hands alone on validation.
feature_groups: [HANDS, POSE, FLAGS]

random_forest:
  n_estimators: 500
  max_features: sqrt
  min_samples_leaf: 1
  augment_copies: 0

recurrent:
  units: [128, 64]  # first and second recurrent layer
  dropout: 0.3
  dense_units: 64
  learning_rate: 1.0e-3
  batch_size: 32
  max_epochs: 300
  # Validation loss bottoms out around epoch 25 while validation accuracy keeps rising until
  # epoch 120+ (the model grows over-confident on the clips it gets wrong), so stopping watches
  # accuracy, with enough patience to ride out its epoch-to-epoch noise.
  monitor: val_accuracy
  patience: 50
  augment: true  # fresh random augmentation of the training set every epoch
  # Class weights are used only if the largest class has this many times the clips of the smallest.
  class_weight_ratio: 1.5

ablation:
  seeds: [42, 43, 44]
  # FLAGS (hand present or not) go with the hands in every configuration.
  configs:
    hands: [HANDS, FLAGS]
    hands_pose: [HANDS, POSE, FLAGS]
    hands_pose_face: [HANDS, POSE, FACE, FLAGS]

# Live app. Frame counts assume about 25 fps (the INCLUDE frame rate); tune them with --debug,
# which shows the motion value per frame. Signs contain holds: in INCLUDE clips, about half of all
# hand-visible frames move less than 0.02 shoulder widths, so the thresholds below were set from
# the longest hold inside each sign (scripts/replay_segmenter.py measures the effect on test).
segmenter:
  start_frames: 3  # consecutive frames with a visible, moving hand that start a sign
  preroll_frames: 6  # frames kept from before the start, so the beginning of the sign is not lost
  end_absent_frames: 8  # hands out of view this long ends a sign
  # At a threshold of 0.01, 95% of train+val signs hold still for at most 12 frames in a row.
  end_still_frames: 15
  max_frames: 150
  # Mean hand-point movement per frame in shoulder widths; a resting hand jitters by about 0.005.
  motion_threshold: 0.01

live:
  model: models/lstm.joblib
  camera_index: 0
  frame_width: 640
  frame_height: 480
  min_confidence: 0.5  # below this the word is shown but not added to the sentence
